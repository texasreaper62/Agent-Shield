name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Core tests
        run: npm test

      - name: Full test suite (40 features)
        run: npm run test:all

      - name: Red team simulation
        run: npm run redteam

      - name: Shield score
        run: npm run score

      - name: Benchmark
        run: npm run benchmark

      - name: Verify examples
        run: node examples/quick-start.js
