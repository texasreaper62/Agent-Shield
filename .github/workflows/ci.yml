name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Custom lint
        run: npm run lint

      - name: ESLint
        run: npx eslint src/ bin/ --max-warnings=0
        continue-on-error: true

      - name: Prettier check
        run: npx prettier --check "src/**/*.js"
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      - name: Core tests
        run: npm test

      - name: Full test suite (40 features)
        run: npm run test:all

      - name: False positive tests
        run: npm run test:fp

      - name: Red team simulation
        run: npm run redteam

      - name: Shield score
        run: npm run score

      - name: Verify examples
        run: node examples/quick-start.js

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov --reporter=json-summary node test/test.js node test/test-modules.js node test/test-new-features.js

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev

      - name: Generate SBOM
        run: node scripts/generate-sbom.js

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Verify zero runtime dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")
          if [ "$DEPS" != "0" ]; then
            echo "ERROR: Runtime dependencies detected ($DEPS). Agent Shield must have zero runtime dependencies."
            exit 1
          fi

      - name: Check for sensitive files in package
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          if grep -qiE '\.env|credentials|secrets?\.' pack-output.txt; then
            echo "ERROR: Potentially sensitive files found in package"
            exit 1
          fi

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Pack (dry run)
        run: npm pack --dry-run
