name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Core tests
        run: npm test

      - name: Full test suite (40 features)
        run: npm run test:all

      - name: External benchmarks
        run: npm run test:benchmark

      - name: False positive tests
        run: npm run test:fp

      - name: Red team simulation
        run: npm run redteam

      - name: Shield score
        run: npm run score

      - name: Benchmark
        run: npm run benchmark

      - name: Verify examples
        run: node examples/quick-start.js

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Pack (dry run)
        run: npm pack --dry-run
