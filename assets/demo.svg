<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="840" height="620">
  <style>
    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px) } to { opacity: 1; transform: translateX(0) } }

    .terminal { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Monaco, 'Courier New', monospace; font-size: 13px; }
    .prompt { fill: #7ec699; }
    .cmd { fill: #e6e6e6; }
    .cyan { fill: #56b6c2; }
    .dim { fill: #636d83; }
    .green { fill: #98c379; }
    .red { fill: #e06c75; }
    .yellow { fill: #e5c07b; }
    .bold { font-weight: 700; }
    .white { fill: #abb2bf; }

    .line0 { animation: slideIn 0.3s ease-out 0.5s both; }
    .line1 { animation: slideIn 0.3s ease-out 0.8s both; }
    .line2 { animation: slideIn 0.3s ease-out 1.0s both; }
    .line3 { animation: slideIn 0.3s ease-out 1.2s both; }
    .line4 { animation: slideIn 0.3s ease-out 1.5s both; }
    .line5 { animation: slideIn 0.3s ease-out 1.8s both; }
    .line6 { animation: slideIn 0.3s ease-out 2.1s both; }
    .line7 { animation: slideIn 0.3s ease-out 2.4s both; }
    .line8 { animation: slideIn 0.3s ease-out 2.7s both; }
    .line9 { animation: slideIn 0.3s ease-out 3.0s both; }
    .line10 { animation: slideIn 0.3s ease-out 3.3s both; }
    .line11 { animation: slideIn 0.3s ease-out 3.6s both; }
    .line12 { animation: slideIn 0.3s ease-out 3.9s both; }
    .line13 { animation: slideIn 0.3s ease-out 4.2s both; }
    .line14 { animation: slideIn 0.3s ease-out 4.4s both; }
    .line15 { animation: slideIn 0.3s ease-out 4.7s both; }
    .line16 { animation: slideIn 0.3s ease-out 5.0s both; }
    .line17 { animation: slideIn 0.3s ease-out 5.3s both; }
    .line18 { animation: slideIn 0.3s ease-out 5.6s both; }
    .line19 { animation: slideIn 0.3s ease-out 5.9s both; }

    .cursor { animation: blink 1s step-end infinite; fill: #528bff; }
  </style>

  <!-- Terminal chrome -->
  <rect width="840" height="620" rx="10" fill="#282c34"/>
  <rect width="840" height="36" rx="10" fill="#21252b"/>
  <rect y="26" width="840" height="10" fill="#21252b"/>
  <circle cx="20" cy="18" r="6" fill="#e06c75"/>
  <circle cx="40" cy="18" r="6" fill="#e5c07b"/>
  <circle cx="60" cy="18" r="6" fill="#98c379"/>
  <text x="420" y="22" text-anchor="middle" class="terminal dim" font-size="12">agent-shield — demo</text>

  <g class="terminal" transform="translate(20, 52)">
    <!-- Prompt -->
    <g class="line0">
      <text y="0"><tspan class="prompt">$</tspan><tspan class="cmd"> npx agent-shield demo</tspan></text>
    </g>

    <!-- Banner -->
    <g class="line1">
      <text y="24" class="cyan" font-size="11">    ___                    __     _____ __    _      __    __</text>
      <text y="36" class="cyan" font-size="11">   /   | ____ ____  ____  / /_   / ___// /_  (_)__  / /___/ /</text>
      <text y="48" class="cyan" font-size="11">  / /| |/ __ `/ _ \/ __ \/ __/   \__ \/ __ \/ / _ \/ / __  /</text>
      <text y="60" class="cyan" font-size="11"> / ___ / /_/ /  __/ / / / /_    ___/ / / / / /  __/ / /_/ /</text>
      <text y="72" class="cyan" font-size="11">/_/  |_\__, /\___/_/ /_/\__/   /____/_/ /_/_/\___/_/\__,_/</text>
      <text y="84" class="cyan" font-size="11">      /____/</text>
