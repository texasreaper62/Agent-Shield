[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentshield"
version = "7.2.1"
description = "Security SDK for AI agents. Detects prompt injection, data exfiltration, and 141 threat patterns. Zero dependencies, runs locally."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
authors = [
    {name = "Agent Shield team"},
]
keywords = ["ai", "security", "prompt-injection", "agent", "llm", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/texasreaper62/Agent-Shield"

[project.scripts]
agentshield = "agent_shield.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
