[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-shield"
version = "1.0.0"
description = "Security SDK for AI agents. Protects against prompt injection, data exfiltration, tool abuse, and 30+ other AI-specific threats."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
keywords = ["ai", "security", "prompt-injection", "agent", "llm", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
agent-shield = "agent_shield.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
