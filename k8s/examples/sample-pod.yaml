# Example: Pod with Agent Shield sidecar injection
#
# The label agent-shield.io/inject: "true" triggers the mutating webhook
# to automatically inject the Agent Shield sidecar container.
#
# Your application can then call http://localhost:8080/scan to check
# any text for prompt injection and other AI threats.

apiVersion: v1
kind: Pod
metadata:
  name: my-ai-agent
  labels:
    app: my-ai-agent
    agent-shield.io/inject: "true"
  annotations:
    agent-shield.io/inject: "true"
spec:
  containers:
    - name: agent
      image: my-ai-agent:latest
      ports:
        - containerPort: 3000
      env:
        # Point your agent at the sidecar for threat scanning
        - name: SHIELD_URL
          value: "http://localhost:8080"
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
