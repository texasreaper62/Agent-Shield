# Agent Shield Operator — Default Values

# -- Sidecar image settings
image:
  repository: agent-shield
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# -- Image pull secrets (if using a private registry)
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
fullnameOverride: ""

# -- Sidecar container settings
sidecar:
  port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -- Webhook server settings
webhook:
  replicaCount: 2
  port: 8443
  healthPort: 8081
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

# -- Agent Shield configuration
config:
  minSeverity: medium
  blockOnThreat: false
  logLevel: info

# -- Mutating webhook settings
mutatingWebhook:
  enabled: true
  failurePolicy: Ignore
  namespaceSelector:
    matchLabels:
      agent-shield.io/enabled: "true"

# -- Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

# -- ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Pod annotations for the webhook server
podAnnotations: {}

# -- Node selector for the webhook server
nodeSelector: {}

# -- Tolerations for the webhook server
tolerations: []

# -- Affinity rules for the webhook server
affinity: {}
