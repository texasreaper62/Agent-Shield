apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-shield.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "agent-shield.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.json: |
    {
      "minSeverity": "{{ .Values.config.minSeverity }}",
      "blockOnThreat": {{ .Values.config.blockOnThreat }},
      "logLevel": "{{ .Values.config.logLevel }}"
    }
